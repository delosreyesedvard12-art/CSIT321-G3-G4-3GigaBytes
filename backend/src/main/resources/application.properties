spring.application.name=gradeahead
server.port=8080

# --- Database: H2 file database (zero setup, data survives restarts, stored in ./data) ---
spring.datasource.url=jdbc:h2:file:./data/gradeahead;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
# H2 console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/gradeahead)

# --- Readable error messages for the frontend ---
server.error.include-message=always
server.error.include-binding-errors=always

# --- To use MySQL instead: add the MySQL Driver dependency, then replace the H2 block with: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/gradeahead?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
